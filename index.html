<article class="public-card" id="publicCard">

  <!-- Layar interaksi sebelum hadiah terbuka -->
  <div class="gift-gate" id="giftGate">
    <div class="gate-decoration" id="gateEmoji">💌</div>

    <p class="gate-eyebrow" id="gateEyebrow">
      SOMETHING FOR YOU
    </p>

    <h2 id="gateTitle">A little surprise...</h2>

    <p class="gate-description" id="gateDescription">
      Someone prepared something special for you.
    </p>

    <button class="gate-button" id="openGiftButton" type="button">
      Buka hadiah ♡
    </button>

    <p class="gate-hint">made with love, just for you</p>
  </div>

  <!-- Isi hadiah disembunyikan sampai interaksi selesai -->
  <div class="gift-reveal" id="giftReveal" hidden>
    <div class="public-emoji" id="publicEmoji">🎁</div>

    <div class="prev-tag" id="publicTag">A LITTLE SURPRISE</div>

    <p class="public-recipient" id="publicRecipient"></p>

    <h2 id="publicTitle">A little gift for you</h2>

    <img id="publicPhoto" hidden alt="Foto hadiah">

    <p class="public-message" id="publicMessage"></p>

    <p class="public-sign" id="publicSign"></p>

    <a
      id="publicSong"
      target="_blank"
      rel="noopener noreferrer"
      hidden
    >
      ♫ Dengarkan lagu pilihan ↗
    </a>

    <div>
      <button class="music-btn" id="publicReplay" type="button">
        Baca lagi ✦
      </button>
    </div>
  </div>

</article>
